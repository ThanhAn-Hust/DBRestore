name: CI Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: Maven Compile & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21 LTS
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Test
        run: mvn clean test

      - name: Package JAR
        run: mvn package -DskipTests

      - name: Test Local Dockerfile Build
        run: docker build -t db-backup:ci-test .
